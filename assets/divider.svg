<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" viewBox="0 0 1200 16">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect x="0" y="7" width="1200" height="2" fill="url(#g)"/>
  <circle cy="8" r="6" fill="#38bdf8" filter="url(#glow)">
    <animate attributeName="cx" from="-20" to="1220" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cy="8" r="2.5" fill="#e0f2fe">
    <animate attributeName="cx" from="-20" to="1220" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
