  <circle cx="24" cy="18" r="6" fill="#f87171"/>
  <circle cx="44" cy="18" r="6" fill="#fbbf24"/>
  <circle cx="64" cy="18" r="6" fill="#34d399"/>
  <text x="380" y="23" text-anchor="middle" class="t c" font-size="13">meiram@kaznu: ~</text>

  <text class="t" x="40" y="88" clip-path="url(#type1)"><tspan class="p">❯ </tspan><tspan class="v">whoami --verbose</tspan></text>

