    </style>
    <clipPath id="type1"><rect x="40" y="70" height="26" width="0"><animate attributeName="width" values="0;640;640" keyTimes="0;.35;1" dur="2.4s" begin="0.4s" fill="freeze"/></rect></clipPath>
