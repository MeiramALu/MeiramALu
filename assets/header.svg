<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1120">
        <animate attributeName="stop-color" values="#0b1120;#0f1d33;#0b1120" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#0f2a44">
        <animate attributeName="stop-color" values="#0f2a44;#1e1b4b;#0f2a44" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#134e5e">
        <animate attributeName="stop-color" values="#134e5e;#312e81;#134e5e" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .code { font: 14px 'Fira Code', Consolas, monospace; fill: #38bdf8; opacity: .18; }
      .name { font: 700 54px 'Segoe UI', Inter, Arial, sans-serif; fill: #f8fafc; letter-spacing: 1px; }
      .sub  { font: 400 20px 'Fira Code', Consolas, monospace; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>

  <!-- drifting code particles -->
  <g>
    <text class="code" x="60" y="320">import torch<animate attributeName="y" from="320" to="-20" dur="14s" repeatCount="indefinite"/></text>
    <text class="code" x="250" y="320">&lt;/&gt;<animate attributeName="y" from="320" to="-20" dur="11s" begin="3s" repeatCount="indefinite"/></text>
    <text class="code" x="420" y="320">def train():<animate attributeName="y" from="320" to="-20" dur="16s" begin="6s" repeatCount="indefinite"/></text>
    <text class="code" x="640" y="320">{ }<animate attributeName="y" from="320" to="-20" dur="12s" begin="1s" repeatCount="indefinite"/></text>
    <text class="code" x="760" y="320">whisper.transcribe()<animate attributeName="y" from="320" to="-20" dur="15s" begin="8s" repeatCount="indefinite"/></text>
    <text class="code" x="1080" y="320">manage.py<animate attributeName="y" from="320" to="-20" dur="13s" begin="4s" repeatCount="indefinite"/></text>
    <text class="code" x="160" y="320">0 1 1 0<animate attributeName="y" from="320" to="-20" dur="17s" begin="9s" repeatCount="indefinite"/></text>
    <text class="code" x="560" y="320">model.eval()<animate attributeName="y" from="320" to="-20" dur="14s" begin="11s" repeatCount="indefinite"/></text>
  </g>

  <!-- orbit emblem -->
  <g transform="translate(1010 150)" filter="url(#glow)">
    <circle r="78" fill="none" stroke="url(#accent)" stroke-width="1.5" stroke-dasharray="6 10" opacity=".7">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/>
    </circle>
    <circle r="54" fill="none" stroke="#38bdf8" stroke-width="1" opacity=".45">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
      <circle cx="78" cy="0" r="5" fill="#a78bfa"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="6s" repeatCount="indefinite"/>
      <circle cx="54" cy="0" r="4" fill="#38bdf8"/>
    </g>
    <text x="0" y="12" text-anchor="middle" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700" fill="url(#accent)">MS</text>
  </g>

  <!-- name -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin=".2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="-40 0" to="0 0" dur="1s" begin=".2s" fill="freeze"/>
    <text class="name" x="80" y="140">Meirambek Shaimerden</text>
  </g>

  <!-- accent line -->
  <rect x="80" y="160" height="4" rx="2" width="0" fill="url(#accent)" filter="url(#glow)">
    <animate attributeName="width" from="0" to="420" dur="1.2s" begin=".8s" fill="freeze"/>
  </rect>

  <!-- subtitle -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="1s" begin="1.4s" fill="freeze"/>
    <text class="sub" x="80" y="205">Computer Engineering · AI &amp; Web Developer</text>
    <text class="sub" x="80" y="238" font-size="17" fill="#64748b">Almaty, Kazakhstan</text>
  </g>
</svg>
